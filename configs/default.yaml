# Default hyperparameters for i4C 2x grayscale restoration MVP
seed: 42
data_root: .
val_ratio: 0.1

model:
  base_ch: 32

train:
  epochs: 30
  batch_size: 8
  lr: 1.0e-3
  weight_decay: 0.0
  num_workers: 0
  lambda_ssim: 0.5
  log_csv: results/train_log.csv
  checkpoint: weights/best.pt

sanity:
  n_pairs: 2
  steps: 200
  lr: 1.0e-3
